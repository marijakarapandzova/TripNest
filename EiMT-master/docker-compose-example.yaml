# docker compose -f docker-compose.yaml up -d

services:
  db:
    image: postgres:17.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d booking" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  api:
    image: maven:3.9.11-eclipse-temurin-21
    restart: unless-stopped
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-JWT_SECRET_HERE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/booking
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      PORT: 3000
      VITE_TOKEN: ${FRONTEND_TOKEN:-}
      VITE_API_TARGET: http://api:8080
    volumes:
      - ./frontend-example:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  pgdata:
  maven-cache:
  frontend-node-modules: